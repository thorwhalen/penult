[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "penult"
version = "0.0.1"
description = "From an idea to a publication draft: research, write, style, illustrate, and post the draft for review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "writing", "essay", "publishing", "substack", "drafting", "research", "agent-skills", "llm",
]
authors = [
    { name = "Thor Whalen" },
]
# The core needs the store (dol), the command line (cw) and article (front matter, and
# the publishing step). Research, style and images are done by agents with other
# packages, which are optional extras; penult calls ductus and penlike as commands.
dependencies = [
    "dol",
    "cw>=0.1.1,<0.2",
    "article>=0.1.5",
]

[project.scripts]
penult = "penult.__main__:main"

[project.urls]
Homepage = "https://github.com/thorwhalen/penult"
Repository = "https://github.com/thorwhalen/penult"
Documentation = "https://thorwhalen.github.io/penult"

[project.optional-dependencies]
publish = [
    "article[substack]",
]
images = [
    "illustration",
    "aix[image]",
]
style = [
    "ductus",
    "penlike",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".github",
    "scrap",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    "**/*.md",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "penult"

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"
skip_publish_marker = "[skip publish]"

[tool.wads.ci.docs]
enabled = true
skip_marker = "[skip github-pages]"
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
